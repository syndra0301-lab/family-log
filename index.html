<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모녀 발자국</title>
<meta name="theme-color" content="#F2F4F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모녀 발자국">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-first column, a date rail per day, flights drawn as boarding-pass stubs */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#151B2C; --muted:#5B6477; --line:#D9DFE8;
  --accent:#2944C4; --accent-soft:#E3E8FB; --on-accent:#FFFFFF;
  --exp:#14775A; --exp-soft:#DDF1E9; --danger:#B3242F;
  --display:"Hahmlet","Noto Serif KR",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121D; --surface:#161B2A; --sunk:#1D2334; --ink:#E7EAF2; --muted:#9BA4B8; --line:#2A3247;
  --accent:#8297FF; --accent-soft:#232C4E; --on-accent:#0E121D;
  --exp:#4FC79C; --exp-soft:#183A31; --danger:#FF7B86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121D; --surface:#161B2A; --sunk:#1D2334; --ink:#E7EAF2; --muted:#9BA4B8; --line:#2A3247;
  --accent:#8297FF; --accent-soft:#232C4E; --on-accent:#0E121D;
  --exp:#4FC79C; --exp-soft:#183A31; --danger:#FF7B86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.exp{background:var(--exp-soft);color:var(--exp)}
.chip.solid{background:var(--accent);color:var(--on-accent)}

/* masthead */
.mast{display:flex;flex-direction:column;gap:6px}
.mast .kicker{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--mono);font-size:16px;margin-right:2px}

/* trip cards */
.year{font-family:var(--mono);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.list{display:flex;flex-direction:column;gap:10px}
.tcard{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%}
.tcard:hover{border-color:var(--accent)}
.tcard .when{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px dashed var(--line);padding-right:12px;min-height:56px}
.tcard .when .m{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tcard .when .d{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.tcard .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.tcard .body .t{font-weight:600;font-size:16px}
.tcard .body .s{font-size:13px;color:var(--muted)}
.next{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;border:0;text-align:left;width:100%}
.next .dd{font-family:var(--mono);font-size:34px;line-height:1}
.next .nt{font-family:var(--display);font-size:20px;font-weight:700}
.next .ns{font-size:13px;opacity:.85}

/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods label{position:relative}
.moods input{position:absolute;opacity:0;width:1px;height:1px}
.moods span{display:inline-block;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.moods input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.moods input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* trip view */
.back{align-self:flex-start}
.thead{display:flex;flex-direction:column;gap:8px}
.thead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.tabs{overflow-x:auto}.tabs button{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.day{display:grid;grid-template-columns:54px 1fr;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
.rail .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rail .d{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.rail .w{font-size:12px;color:var(--muted)}
.rail .line{flex:1;width:1px;background:var(--line);margin-top:6px}
.items{display:flex;flex-direction:column;gap:8px;min-width:0;padding-bottom:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.item .ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.item .ic svg{width:17px;height:17px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .tm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .tt{font-weight:600;overflow-wrap:anywhere}
.idealink{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:12px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--ink,inherit);font-weight:600;text-align:left;cursor:pointer}
.note.idea.done{opacity:.7}
.reply{font-size:13px;background:var(--sunk);border-radius:9px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.pdfchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--accent);text-decoration:none}
.flash .item,.flash .pass{outline:2px solid var(--accent);outline-offset:2px}
input.bad{border-color:var(--danger);box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 25%,transparent)}
.item.alt{border-style:dashed;background:transparent}
.inlink.pin::before{content:'📍';margin-right:1px}
.item .dt{font-size:13px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.item.quiet{background:transparent;border-style:dashed}
.empty-day{font-size:13px;color:var(--muted);padding:8px 0}
/* boarding pass */
.pass{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr auto;overflow:hidden}
.pass .main{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pass .route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.pass .code{font-family:var(--mono);font-size:24px;line-height:1}
.pass .city{font-size:12px;color:var(--muted)}
.pass .arrow{height:1px;background:var(--line);position:relative}
.pass .arrow svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;color:var(--accent);background:var(--surface);padding:0 2px}
.pass .times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:15px}
.pass .stub{border-left:2px dashed var(--line);padding:12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:6px;min-width:84px;position:relative}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass .stub::before{top:-9px}.pass .stub::after{bottom:-9px}
.pass .fno{font-family:var(--mono);font-size:15px;font-weight:500}
.pass .air{font-size:12px;color:var(--muted);text-align:right}
.del{background:none;border:0;color:var(--muted);font-size:12px;padding:2px 0}
.del:hover{color:var(--danger)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px}

/* notes */
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.note .who{display:flex;gap:10px;align-items:center}
.note .who img{width:30px;height:30px;border-radius:50%;flex:none}
.note .who .nm{font-weight:600;font-size:14px}
.note .who .nd{font-size:12px;color:var(--muted)}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.note .ph{border-radius:10px;width:100%;max-height:420px;object-fit:cover;background:var(--sunk)}
.notice{background:var(--sunk);border-radius:12px;padding:14px;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
/* checklist */
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.group{display:flex;flex-direction:column;gap:2px}
.group h4{margin:8px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.check .ct{flex:1;min-width:0;overflow-wrap:anywhere}
.check.done .ct{text-decoration:line-through;color:var(--muted)}
/* budget */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum b{font-family:var(--mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cats{display:flex;flex-direction:column;gap:8px}
.cat{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;font-size:13px}
.cat .bar i{background:var(--accent)}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;align-items:center}
.bitem .bt{font-weight:600;min-width:0;overflow-wrap:anywhere}
.bitem .bs{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paid{font-size:12px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 9px;color:var(--muted)}
.paid.on{background:var(--exp-soft);color:var(--exp);border-color:transparent}
/* research */
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rcard .rt{font-weight:600;overflow-wrap:anywhere}
.rcard .rn{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.fav{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.fav.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.maps{display:flex;flex-direction:column;gap:8px}
.maps .row a{text-decoration:none}
.mapbtn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.daymap{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:6px}
.att{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-left:2px}
.att .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--sunk);display:block}
.att a.lk{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;max-width:100%;overflow-wrap:anywhere}
.attbtn{background:none;border:1px dashed var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}
.inlink{color:var(--accent);overflow-wrap:anywhere}
/* experience info */
.info{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:14px}
.info dt{color:var(--muted);font-size:13px;font-weight:600}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){
  .day{grid-template-columns:1fr;gap:6px}
  .rail{flex-direction:row;align-items:baseline;gap:8px;padding:6px 2px;position:sticky;top:0;z-index:2;background:var(--bg)}
  .rail .d{font-size:18px}.rail .line{display:none}
  .item{padding:10px;gap:8px}
  .item .ic{width:24px;height:24px;border-radius:6px}.item .ic svg{width:14px;height:14px}
  .pass .main{padding:10px 12px}.pass .stub{padding:10px;min-width:72px}
}
@media (max-width:440px){.grid2{grid-template-columns:1fr}.sum b{font-size:15px}.cat{grid-template-columns:64px 1fr auto}.tcard{grid-template-columns:60px 1fr}.tcard .go{display:none}h1{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.tcard,.btn{transition:border-color .15s,opacity .15s}}
.who-pick{position:fixed;inset:0;background:rgba(10,14,24,.45);display:grid;place-items:center;padding:16px;z-index:50}
.who-pick .panel{max-width:360px;width:100%;background:var(--surface)}
.who-pick .row .btn{flex:1}
.whoami{font-size:13px}
.whoami button{background:none;border:0;color:var(--accent);font:inherit;padding:0;margin-left:6px;cursor:pointer}
.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:60;padding:12px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="mast">
    <div class="kicker">TRAVEL &amp; EXPERIENCE LOG</div>
    <h1>모녀 발자국</h1>
    <p class="muted">엄마와 함께 다닌 여행과 체험을 둘이 같이 남기는 기록장</p>
  </header>
  <div id="view"><div class="notice">기록을 불러오는 중이에요…</div></div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>

function render(){const v=document.getElementById('view');
  const active=document.activeElement&&document.activeElement.id;
  const keep={};v.querySelectorAll('input,textarea,select').forEach(el=>{if(!el.id||el.type==='file')return;if(el.type==='checkbox'){if(el.id==='bg-paid'&&el.checked)keep[el.id]=true;return;}if(el.type==='radio'){if(el.checked)keep[el.id]=true;return;}keep[el.id]=el.value;});
  const fileEls=['nf-photo','pf-photo','at-photo'].map(i=>v.querySelector('#'+i)).filter(Boolean);
  const box=h('div',{class:'wrap',style:'gap:16px'},S.page==='ideas'?viewIdeas():S.tripId?viewTrip():viewHome(),S.page?null:ideaLink());
  v.replaceChildren(box);
  for(const id in keep){const el=document.getElementById(id);if(!el)continue;if(el.type==='radio'||el.type==='checkbox')el.checked=true;else el.value=keep[id];
    if(id==='pf-type'){const e=new Event('change');el.dispatchEvent(e);}}
  fileEls.forEach(fe=>{const nf=document.getElementById(fe.id);if(nf)nf.replaceWith(fe);});
  if(active){const el=document.getElementById(active);if(el)el.focus({preventScroll:true});}}
window.__rerender=()=>render();
boot();
})();
</script>
</body>
</html>
